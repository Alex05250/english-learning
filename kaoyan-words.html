const TOTAL = 5492;
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const dayRec = d => DAYS.find(x => x[0] === d);

function renderGrid() {
  const html = DAYS.map(([d, s, e, c]) => `
    <a class="drow" href="kaoyan/day${pad(d)}.html" data-day="${d}" data-state="new">
      <span class="dn"><em>Day</em>${pad(d)}</span>
      <span class="drng">No.${s} – ${e}</span>
      <span class="dprog"><span class="dbar"><i></i></span><span class="dc"><b>0</b><s>/${c}</s></span></span>
      <span class="dstate">未开始</span>
      <span class="dgo">进入<svg class="arw" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>`).join('');
  $('#grid').insertAdjacentHTML('beforeend', html);
  K.revealCards('.drow');
  refresh(true);
}

function refresh(animate) {
  let n = 0, started = 0;
  DAYS.forEach(([d]) => { const k = K.countDay(d); n += k; if (k) started++; });
  animate ? K.countTo($('#mDone'), n) : ($('#mDone').textContent = n);
  $('#mPct').textContent = (100 * n / TOTAL).toFixed(1) + '%';
  $('#mBar').style.width = (100 * n / TOTAL).toFixed(2) + '%';
  $('#mStarted').textContent = started;
  $('#mLeft').textContent = (TOTAL - n);

  document.querySelectorAll('.drow').forEach(row => {
    const d = +row.dataset.day, rec = dayRec(d), k = K.countDay(d), total = rec[3];
    const full = k === total;
    row.querySelector('.dbar i').style.width = (100 * k / total).toFixed(1) + '%';
    row.querySelector('.dc b').textContent = k;
    row.dataset.state = full ? 'full' : (k ? 'doing' : 'new');
    row.querySelector('.dstate').textContent = full ? '已完成' : (k ? '进行中' : '未开始');
    row.classList.toggle('full', full);
  });

  const next = DAYS.find(([d, , , c]) => K.countDay(d) < c) || DAYS[0];
  $('#mGo').href = 'kaoyan/day' + pad(next[0]) + '.html';
  $('#mGoTxt').textContent = (n ? '继续背 Day ' : '开始背 Day ') + pad(next[0]);

  applyFilter();
}

/* ── 进度筛选 ── */
let filter = 'all';
const EMPTY_TEXT = { all: '', new: '每天都是开着的，从 Day 01 开始就行。', doing: '还没有开了头、又没勾完的天。', full: '还没有整天勾完。' };

function applyFilter() {
  let shown = 0;
  document.querySelectorAll('.drow').forEach(r => {
    const ok = filter === 'all' || r.dataset.state === filter;
    r.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  const box = $('#dempty');
  box.hidden = shown > 0;
  box.textContent = EMPTY_TEXT[filter] || '';
}

document.querySelectorAll('#filters button').forEach(b => {
  b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    applyFilter();
  };
});

/* 全站搜索 */
const FLAT = [];
DAYS.forEach(([d, s, e, c, rev, items]) => items.forEach(it => FLAT.push([d].concat(it))));

function hl(text, q) {
  if (!q) return K.esc(text);
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return K.esc(text);
  return K.esc(text.slice(0, i)) + '<mark>' + K.esc(text.slice(i, i + q.length)) + '</mark>' + K.esc(text.slice(i + q.length));
}

$('#q').addEventListener('input', e => {
  const raw = e.target.value.trim(), q = raw.toLowerCase();
  if (!q) { $('#hitsWrap').style.display = 'none'; $('.stage').style.display = ''; return; }
  $('.stage').style.display = 'none';
  $('#hitsWrap').style.display = '';
  const hits = FLAT.filter(r => {
    const w = r[2].toLowerCase(), senses = r[4];
    return w.includes(q) || senses.some(s => s.slice(1).join('').toLowerCase().includes(q));
  });
  $('#hint').textContent = hits.length ? `${hits.length} 个词命中「${raw}」` : `没有匹配「${raw}」的词`;
  $('#hits').innerHTML = hits.slice(0, 240).map((r, i) => {
    const [d, n, w, ipa, senses] = r;
    const on = K.daySet(d).has(w);
    const body = senses.map(s => `<div class="sline"><span class="pos">${K.esc(s[0])}</span><span class="defs">${
      s.slice(1).map(x => hl(x, q)).join('<span class="sep">·</span>')}</span></div>`).join('');
    return `<div class="wrow${on ? ' done' : ''}" style="--i:${Math.min(i, 20)}">
      <div>
        <div class="head"><span class="w">${hl(w, q)}</span><span class="ipa">${K.esc(ipa)}</span></div>
        <div class="senses">${body}</div>
        <a href="kaoyan/day${String(d).padStart(2, '0')}.html" style="font-size:11.5px;color:var(--accent);text-decoration:none">Day ${d} →</a>
      </div>
      <button class="mark" data-d="${d}" data-w="${K.esc(w)}" aria-label="标记已会">✓</button>
    </div>`;
  }).join('');
});

document.addEventListener('click', e => {
  const b = e.target.closest('.mark'); if (!b) return;
  const d = +b.dataset.d, w = b.dataset.w;
  const on = K.toggle(d, w);
  b.closest('.wrow').classList.toggle('done', on);
  refresh(true);
});

/* 闪卡 */
let flash = null;
function openFlash() {
  if (!flash) {
    const deck = FLAT.map(r => [r[0], r[1], r[2], r[3], r[4]]);
    flash = K.createFlash($('#flash'), deck, { onChange: () => refresh(true) });
  } else flash.open();
  $('#flash').classList.add('on');
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  if (b.dataset.mode === 'flash') openFlash();
});

renderGrid();
</script>
